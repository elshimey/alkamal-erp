name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: alkamal_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/alkamal_erp
      TEST_DATABASE_URL: postgres://erp:erp@localhost:5432/alkamal_erp_test
      E2E_DATABASE_URL: postgres://erp:erp@localhost:5432/alkamal_erp_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Create test databases
        run: |
          PGPASSWORD=erp psql -h localhost -U erp -d alkamal_erp -c "create database alkamal_erp_test"
          PGPASSWORD=erp psql -h localhost -U erp -d alkamal_erp -c "create database alkamal_erp_e2e"
      - name: Migrate and seed
        run: npm run db:setup
        env:
          ADMIN_PASSWORD: ci-only-password
      - run: npm test
      - run: npm run build
      # اختبارات المتصفح: الشحنة حتى التحصيل، المصروف، رحلة السائق، وعزل الشركات
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # فحص أمني بـ Semgrep: قواعد البرنامج الخاصة (.semgrep/) + قواعد Semgrep العامة للثغرات والأسرار
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.186.0
      - name: Semgrep (قواعد البرنامج)
        run: semgrep scan --config .semgrep/ --error --metrics off
      - name: Semgrep (القواعد العامة، الخطيرة فقط)
        run: semgrep scan --config p/secrets --config p/javascript --config p/typescript --config p/react --config p/nextjs --severity ERROR --error --metrics off src scripts
